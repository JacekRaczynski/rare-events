<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>   
    footer {
        background-color: #1c3972;
        padding: 20px;
        text-align: center;
        font-size: 12px;
        color: #f5ebe2;
    }

    .card-container {
        color: #f5ebe2;
        display: flex;
        gap: 50px;
        justify-content: space-between;
        flex-wrap: wrap;
        margin-left: 5dvw;
        margin-right: 5dvw;
        padding: 40px 20px;
        overflow-x: auto; 
        }

    .card {
        flex: 1 1 calc(33.333% -20px); 
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 2dvw;
        width: 20dvw;
        min-width: 270px;
        box-shadow: 0 2px 5px rgba(222, 180, 180, 0.1);
        background-color: #1c3972;
    }

    .card h3 {
        margin-top: 0;
        font-size: 22px;
        color: #f5ebe2;
    }

    /* Responsywność */
    @media (max-width: 968px) {
        .card-container {
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        .card {
            width: 70%;
            max-width: 90%;
        }
        .card h3 {
        margin-top: 0;
        font-size: 19px;
        color: #f5ebe2;
    }
    }

</style>
